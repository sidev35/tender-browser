# Tool settings only; the project is run as `python scraper.py`, not installed.

[tool.ruff]
target-version = "py311"   # what CI runs (.github/workflows/*.yml)
line-length = 110
extend-exclude = ["graphify-out", "tests/fixtures"]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (undefined names, unused imports),
# I: import order, B: likely bugs, UP: modern Python syntax.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tender_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

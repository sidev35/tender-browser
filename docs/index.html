<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Light by default, whatever the OS setting; a theme picked with the
  // toggle is remembered. Runs before the styles load, so there's no flash
  // of the wrong theme on refresh.
  try {
    const saved = localStorage.getItem('tenderRadar_theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tender Radar — EV Charging Infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="shell">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 3 14h7l-1 8 11-14h-8l1-6z" fill="#06121F"/></svg>
      </div>
      <div>
        <h1>Tender Radar</h1>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="notifyToggle" title="Enable browser notifications" aria-label="Enable browser notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="icon-btn" id="updateBtn" title="Refresh live tender data" aria-label="Refresh live tender data">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="toast-stack" id="toastStack"></div>

  <div class="new-banner" id="newBanner">
    <span id="newBannerText"></span>
    <button id="dismissNew">Mark all as read</button>
  </div>

  <div class="stats">
    <div class="stat clickable" id="statTotalTile" role="button" tabindex="0" title="Show all tenders"><span class="stat-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><div class="num" id="statTotal">0</div><div class="lbl">Matched tenders</div></div>
    <div class="stat urgent"><span class="stat-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></svg></span><div class="num" id="statUrgent">0</div><div class="lbl">Due within 7 days</div></div>
    <div class="stat has-tip" tabindex="0"><span class="stat-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><div class="num" id="statSources">0</div><div class="lbl">Source portals</div><div class="tip" id="statSourcesTip" role="tooltip"></div></div>
    <div class="stat new clickable" id="statNewTile" role="button" tabindex="0" title="Show only the new tenders"><span class="stat-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></svg></span><div class="num" id="statNew">0</div><div class="lbl">New since last visit</div></div>
  </div>

  <div class="controls">
    <select class="sortsel" id="countrySel" title="Show tenders from this country">
      <option value="India">Country: India</option>
      <option value="Australia">Country: Australia</option>
    </select>
    <input type="search" id="searchBox" placeholder="Search by title or source…">
    <select class="sortsel" id="sortSel">
      <option value="due">Sort: Due date (soonest)</option>
      <option value="recent">Sort: Recently added</option>
      <option value="value_desc">Sort: Value (highest)</option>
      <option value="value_asc">Sort: Value (lowest)</option>
    </select>
  </div>
  <div class="controls">
    <div class="pills" id="categoryPills"></div>
  </div>
  <div class="controls value-row" id="valueRow" hidden>
    <span class="vf-label">Value</span>
    <div class="vf-slider" id="valueSlider">
      <input type="range" id="minValueSlider" min="0" max="10" step="1" value="0" aria-label="Minimum tender value">
      <output id="minValueLabel" for="minValueSlider">Any value</output>
    </div>
  </div>

  <div id="groups" aria-busy="true">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <footer class="note">
    Last data sync: <strong id="syncTime"></strong>
  </footer>

</div>

<button class="to-top" id="toTop" type="button" aria-label="Back to top" title="Back to top">&uarr;</button>

<!-- All behaviour lives in js/ (see js/main.js). Modules need the page served over
     http(s): run `python -m http.server` from the repo root, not file://. -->
<script type="module" src="js/main.js"></script>
</body>
</html>

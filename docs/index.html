<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Light by default, whatever the OS setting; a theme picked with the
  // toggle is remembered. Runs before the styles load, so there's no flash
  // of the wrong theme on refresh.
  try {
    const saved = localStorage.getItem('tenderRadar_theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tender Radar — EV Charging Infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 3 14h7l-1 8 11-14h-8l1-6z" fill="#08150F"/></svg>
      </div>
      <div>
        <h1>Tender Radar</h1>
        <div class="sub">EV charging infrastructure &middot; matched from official govt &amp; PSU portals</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="notifyToggle" title="Enable browser notifications" aria-label="Enable browser notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="icon-btn" id="updateBtn" title="Refresh live tender data" aria-label="Refresh live tender data">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="toast-stack" id="toastStack"></div>

  <div class="new-banner" id="newBanner">
    <span id="newBannerText"></span>
    <button id="dismissNew">Mark as seen</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Matched tenders</div></div>
    <div class="stat urgent"><div class="num" id="statUrgent">0</div><div class="lbl">Due within 7 days</div></div>
    <div class="stat"><div class="num" id="statSources">0</div><div class="lbl">Source portals</div></div>
    <div class="stat new clickable" id="statNewTile" role="button" tabindex="0" title="Show only the new tenders"><div class="num" id="statNew">0</div><div class="lbl">New since last visit</div></div>
  </div>

  <div class="controls">
    <input type="search" id="searchBox" placeholder="Search by title or source…">
    <select class="sortsel" id="sortSel">
      <option value="due">Sort: Due date (soonest)</option>
      <option value="recent">Sort: Recently added</option>
    </select>
  </div>
  <div class="controls">
    <div class="pills" id="categoryPills"></div>
  </div>

  <div id="groups"></div>

  <footer class="note">
    Last data sync: <strong id="syncTime"></strong>
  </footer>

</div>

<!-- All behaviour lives in js/ (see js/main.js). Modules need the page served over
     http(s): run `python -m http.server` from the repo root, not file://. -->
<script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Tender Radar digest</title>
<!-- HTML version of the digest email. Mail apps show this; email_template.txt is
     the plain-text fallback. The subject line comes from email_template.txt.
     tender_radar/notify.py fills in the placeholders below (the names in double
     curly braces: RUN_TIME, NEW_COUNT, DUE_SOON_COUNT, NEW_SECTION,
     DUE_SOON_SECTION, DASHBOARD_URL). Don't write a placeholder inside this
     comment: it would be filled in here too.

     Deliberately colourless, like a normal Gmail message: no background and no
     text colour is set anywhere, so the reader's mail app supplies them and the
     email looks right in both its light and dark themes. Only layout, borders
     (semi-transparent grey) and type weight are set here. Faded text uses
     opacity, not a colour.

     The style block adds the gentle motion (the beating bolt and its ring, cards
     rising in, a pulsing dot, a hover lift). Apple Mail, iOS Mail, Outlook for Mac and Thunderbird show it;
     Gmail and Outlook for Windows drop it and show the static design.
     Preview it live, without sending anything: python preview_email.py -->
<style>
  @keyframes tr-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes tr-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tr-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  @keyframes tr-blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes tr-bolt { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes tr-ring { 0% { opacity: .55; transform: scale(.92); } 70%, 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes tr-sheen { 0% { transform: translateX(-130%) skewX(-20deg); } 60%, 100% { transform: translateX(260%) skewX(-20deg); } }

  .tr-head { animation: tr-fade .7s ease backwards; }
  .tr-mark span { display: inline-block; animation: tr-bolt 3s ease-in-out infinite; }
  .tr-mark i { position: absolute; left: -5px; top: -5px; right: -5px; bottom: -5px; border: 1.5px solid currentColor; border-radius: 16px; opacity: 0; animation: tr-ring 3s ease-out infinite; }
  .tr-tile { animation: tr-rise .6s cubic-bezier(.2, .8, .2, 1) backwards; }
  .tr-card { animation: tr-rise .6s cubic-bezier(.2, .8, .2, 1) backwards; transition: transform .25s ease, box-shadow .25s ease; }
  .tr-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(128, 128, 128, .3); }
  .tr-d1 { animation-delay: .10s; } .tr-d2 { animation-delay: .18s; } .tr-d3 { animation-delay: .26s; }
  .tr-d4 { animation-delay: .34s; } .tr-d5 { animation-delay: .42s; } .tr-d6 { animation-delay: .50s; }
  .tr-live { animation: tr-dot 1.8s ease-in-out infinite; }
  .tr-new { animation: tr-blink 2.4s ease-in-out infinite; }
  .tr-cta { position: relative; overflow: hidden; transition: transform .25s ease, box-shadow .25s ease; }
  .tr-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(128, 128, 128, .35); }
  .tr-cta b { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: rgba(128, 128, 128, .22); animation: tr-sheen 3.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .tr-head, .tr-tile, .tr-card, .tr-live, .tr-new, .tr-cta b, .tr-mark span, .tr-mark i { animation: none !important; }
  }
  @media only screen and (max-width: 520px) {
    .tr-wrap { padding: 12px 8px !important; }
    .tr-tile { display: block !important; width: auto !important; margin-bottom: 10px !important; }
  }
</style>
</head>
<body style="margin: 0; padding: 0;">
<div class="tr-wrap" style="padding: 20px 12px; font-family: 'Google Sans', Roboto, 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.55;">
  <div style="max-width: 640px; margin: 0 auto;">

    <div class="tr-head" style="padding-bottom: 14px; border-bottom: 1px solid rgba(128, 128, 128, .35);">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
        <tr>
          <td valign="middle" style="padding: 0 14px 0 4px;">
            <div class="tr-mark" style="position: relative; width: 40px; height: 40px; border: 1.5px solid currentColor; border-radius: 12px; text-align: center; line-height: 40px; font-size: 21px;"><i></i><span>&#9889;&#xFE0E;</span></div>
          </td>
          <td valign="middle">
            <div style="font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2;">Tender Radar</div>
            <div style="font-size: 12.5px; opacity: .7; margin-top: 3px;">Automatic digest &middot; {{RUN_TIME}}</div>
          </td>
        </tr>
      </table>
    </div>

    <!-- Summary tiles -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: separate; border-spacing: 0; margin-top: 18px;">
      <tr>
        <td class="tr-tile" width="48%" valign="top" style="border: 1px solid rgba(128, 128, 128, .35); border-radius: 10px; padding: 12px 16px;">
          <div style="font-size: 28px; font-weight: 700; line-height: 1.1;">{{NEW_COUNT}}</div>
          <div style="font-size: 12px; opacity: .7; margin-top: 2px;">New tenders</div>
        </td>
        <td width="12" style="font-size: 0; line-height: 0;">&nbsp;</td>
        <td class="tr-tile" width="48%" valign="top" style="border: 1px solid rgba(128, 128, 128, .35); border-radius: 10px; padding: 12px 16px; animation-delay: .08s;">
          <div style="font-size: 28px; font-weight: 700; line-height: 1.1;">{{DUE_SOON_COUNT}} <span class="tr-live" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; vertical-align: middle;"></span></div>
          <div style="font-size: 12px; opacity: .7; margin-top: 2px;">Closing soon</div>
        </td>
      </tr>
    </table>

    <div>
      {{NEW_SECTION}}

      {{DUE_SOON_SECTION}}
    </div>

    <!-- Call to action -->
    <div style="padding: 10px 0 22px; text-align: center;">
      <a href="{{DASHBOARD_URL}}" class="tr-cta" style="display: inline-block; position: relative; overflow: hidden; padding: 11px 24px; border: 1px solid currentColor; border-radius: 22px; font-weight: 600; font-size: 14px; text-decoration: none;"><b></b>Open the Tender Radar dashboard &rarr;</a>
    </div>
  </div>
</div>
</body>
</html>

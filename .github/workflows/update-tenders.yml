name: Update EV charging tenders

on:
  schedule:
    # Runs at 03:00 and 15:00 UTC = 08:30 and 20:30 IST. Edit the cron
    # expressions below to change frequency (this is UTC time, always).
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab for on-demand runs

permissions:
  contents: write   # needed so the workflow can commit the updated data file back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated tender data if anything changed
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/tenders.json
          if git diff --cached --quiet; then
            echo "No new tenders — nothing to commit."
          else
            git commit -m "Auto-update tender data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

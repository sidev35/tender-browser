name: Update EV charging tenders

on:
  schedule:
    # Every 15 minutes — matches how often each portal's free "latest 10"
    # homepage widget actually rotates, so we catch a tender before it
    # scrolls off (GitHub Actions cron is always UTC, but this interval
    # doesn't depend on timezone). Email digests are throttled separately
    # (see notify.py / MIN_HOURS_BETWEEN_DIGESTS) so this frequency doesn't
    # translate into 96 emails a day.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab for on-demand runs

concurrency:
  group: update-tenders
  cancel-in-progress: false   # queue a run rather than overlap with one still in progress

permissions:
  contents: write   # needed so the workflow can commit the updated data file back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only needed while sources.json has at least one "js_rendered_table"
      # source enabled. This adds real time to every single run (this
      # workflow fires every 15 minutes) — a browser download/install plus
      # several seconds of page-render time per JS source, not a one-off
      # cost. If you end up with no js_rendered_table sources enabled,
      # remove this step to go back to the lighter/faster run.
      - name: Install Playwright browser (for JS-rendered sources)
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          NOTIFY_FROM_EMAIL: ${{ vars.NOTIFY_FROM_EMAIL }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          DUE_SOON_DAYS: ${{ vars.DUE_SOON_DAYS }}
          MIN_HOURS_BETWEEN_DIGESTS: ${{ vars.MIN_HOURS_BETWEEN_DIGESTS }}
          # scraper.py defaults to the system's Microsoft Edge (for local runs
          # on networks that block Playwright's browser download); here, use
          # the Chromium installed by the step above instead.
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
        run: python scraper.py

      - name: Commit updated tender data if anything changed
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/tenders.json
          # digest_state.json only exists once an email has actually been sent
          # (needs SendGrid configured) — "git add" a nonexistent path is a
          # fatal error, which was silently killing this step on every run.
          if [ -f digest_state.json ]; then git add digest_state.json; fi
          if git diff --cached --quiet; then
            echo "No new tenders — nothing to commit."
          else
            git commit -m "Auto-update tender data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase
            git push
          fi
